version: '3'

vars:
  APP_NAME: "weedybox"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # 本项目只出 Windows 版本，GOOS 固定为 windows，不再跟随宿主 OS、
  # 也不再支持 `wails3 build GOOS=...` 跨平台覆盖（下面只 include 了 windows）。
  # 如需恢复多平台：把对应的 include 与这里改回 '{{.GOOS | default OS}}' 即可。
  GOOS: windows

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  # 已裁剪：darwin / linux / ios / android
  # 本项目只构建 Windows；这些平台的 Taskfile 已不再挂载，
  # 因此 `task build` / `package` / `run` 只会分发到 windows。
  # 需要时用 `wails3 update build-assets` 重新生成对应平台目录后再加回 include。

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

